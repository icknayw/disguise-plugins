<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="disguise-plugin-window-size" content="740,500"><meta name="disguise-plugin-window-resizable" content="false"><title>Videohub Monitor</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main id="monitor"><header><span id="model">Videohub Monitor</span><span id="connection">Connecting</span><time id="updated"></time><a href="/settings">Settings</a></header><div id="matrix" aria-label="Routing matrix"></div><div class="takebar"><span id="selection">Select a crosspoint</span><button id="take" disabled>Take</button><button id="cancel" class="secondary" disabled>Cancel</button></div><footer><span id="address"></span><span>NRMW</span></footer></main><form id="settings" hidden><header><h1>Videohub Settings</h1><a href="/">Cancel</a></header><div class="options"><label>Matrix IP<input id="host" autocomplete="off" placeholder="192.168.1.10"></label><label>Size<select id="size"><option value="compact">Compact</option><option value="standard">Standard</option><option value="large">Large</option></select></label><label>Orientation<select id="orientation"><option value="inputs-left">Inputs on left</option><option value="inputs-top">Inputs on top</option></select></label><button id="connect" type="button">Save &amp; connect</button></div><div class="port-lists"><section><h2>Inputs <span id="input-count"></span></h2><div class="list-tools"><input id="input-search" aria-label="Search inputs" placeholder="Search inputs"><button type="button" data-all="inputs">All</button><button type="button" data-none="inputs">None</button></div><div id="inputs" class="port-list"></div></section><section><h2>Outputs <span id="output-count"></span></h2><div class="list-tools"><input id="output-search" aria-label="Search outputs" placeholder="Search outputs"><button type="button" data-all="outputs">All</button><button type="button" data-none="outputs">None</button></div><div id="outputs" class="port-list"></div></section></div><footer><button id="save">Save</button><span>NRMW</span></footer></form><div id="error" role="status"></div></body></html>
